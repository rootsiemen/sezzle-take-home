global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /otel-lgtm/rules.yaml

scrape_configs:
  - job_name: weatherlookup
    metrics_path: /metrics
    static_configs:
      - targets:
          - weatherlookup.weatherlookup.svc.cluster.local:8080
        labels:
          service: weatherlookup
          namespace: weatherlookup
